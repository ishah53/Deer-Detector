<!DOCTYPE html>
<html>
<head>
    <title>Deer Alert Hub</title>
    <!-- Use these exact, rock-solid stable library versions -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
</head>
<body style="font-family:sans-serif; text-align:center; padding:20px; background-color:#111; color:#fff;">
    <h2>Deer Tracking Link</h2>
    
    <button id="connectBtn" style="padding:15px; font-size:16px; margin:10px;">1. Link Pico Board</button>
    <button id="startBtn" style="padding:15px; font-size:16px; margin:10px;">2. Boot Camera Feed</button>
    
    <div id="webcam-container" style="margin:20px auto; width:224px; border:3px solid #444;"></div>
    <h1 id="status" style="color:green;">SYSTEM STATE: INITIALIZING</h1>

    <script type="text/javascript">
        // REPLACE THIS URL STUB WITH YOUR EXPORTED TEACHABLE MACHINE LINK
        // Ensure there is EXACTLY one forward slash at the very end of your link
        const URL = "https://withgoogle.com";
        
        let model, webcam, port, writer;

        // Visual feedback to verify libraries are active right away
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof tmImage !== 'undefined') {
                document.getElementById("status").innerText = "SYSTEM STATE: READY TO CONNECT";
            } else {
                document.getElementById("status").innerText = "ERROR: LIBRARIES NOT LOADED";
            }
        });

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 }); 
                const encoder = new TextEncoderStream();
                encoder.readable.pipeTo(port.writable);
                writer = encoder.writable.getWriter();
                document.getElementById('connectBtn').innerText = "Pico Connected!";
            } catch (err) {
                alert("USB Serial Connection Failed: " + err);
            }
        });

        document.getElementById('startBtn').addEventListener('click', async () => {
            // Safety check to ensure library has populated globally
            if (typeof tmImage === 'undefined') {
                alert("Teachable Machine library is still downloading from Google CDN. Wait 3 seconds and tap again!");
                return;
            }
            
            document.getElementById('startBtn').innerText = "Loading AI Model...";
            model = await tmImage.load(URL + "model.json", URL + "metadata.json");
            
            webcam = new tmImage.Webcam(224, 224, true); 
            await webcam.setup({ facingMode: "environment" }); 
            await webcam.play();
            
            document.getElementById("webcam-container").innerHTML = ""; // Clear loader
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            document.getElementById('startBtn').innerText = "AI Monitoring Live";
            window.requestAnimationFrame(loop);
        });

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        let lastState = "";
        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            // Checks confidence array index 0 (assuming your Class 0 is "Deer")
            let deerConfidence = prediction.probability;
            let percentage = Math.round(deerConfidence * 100);
            let currentState = "CLEAR";

            if (percentage >= 90) {
                currentState = "CRITICAL";
                document.getElementById("status").innerText = `CRITICAL DETECT: ${percentage}%`;
                document.getElementById("status").style.color = "#ff4444";
            } else if (percentage >= 50) {
                currentState = "ALERT";
                document.getElementById("status").innerText = `WARNING ALERT: ${percentage}%`;
                document.getElementById("status").style.color = "#ffaa00";
            } else {
                currentState = "CLEAR";
                document.getElementById("status").innerText = `SAFE ROAD STATE: ${percentage}%`;
                document.getElementById("status").style.color = "#00ff00";
            }

            if (currentState !== lastState) {
                lastState = currentState;
                if (writer) {
                    await writer.write(currentState + "\n");
                }
            }
        }
    </script>
</body>
</html>
