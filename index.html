<!DOCTYPE html>
<html>
<head>
    <title>Deer Alert Hub</title>
</head>
<body style="font-family:sans-serif; text-align:center; padding:20px; background-color:#111; color:#fff;">
    <h2>Deer Tracking Link</h2>
    
    <button id="connectBtn" style="padding:15px; font-size:16px; margin:10px;" disabled>1. Link Pico Board</button>
    <button id="startBtn" style="padding:15px; font-size:16px; margin:10px;" disabled>2. Boot Camera Feed</button>
    
    <div id="webcam-container" style="margin:20px auto; width:224px; border:3px solid #444;"></div>
    <h1 id="status" style="color:orange;">SYSTEM STATE: DOWNLOADING AI LIBRARIES...</h1>

    <script type="text/javascript">
        // REPLACE THIS URL STUB WITH YOUR EXPORTED TEACHABLE MACHINE LINK
        const URL = "https://teachablemachine.withgoogle.com/models/twE1Y5Uvw/";
        
        let model, webcam, port, writer;

        // Dynamic Safe Script Loader to prevent out-of-order execution
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => resolve();
                script.onerror = () => reject(new Error(`Failed to load script: ${src}`));
                document.head.appendChild(script);
            });
        }

        // Wait until both essential scripts are fully injected and parsed
        async function initializeLibraries() {
            try {
                // Load TensorFlow Core first
                await loadScript("https://jsdelivr.net");
                // Then load Teachable Machine Image Layer sequentially
                await loadScript("https://jsdelivr.net");
                
                // Once reached, it is mathematically impossible for tmImage to be undefined
                document.getElementById("status").innerText = "SYSTEM STATE: READY TO CONNECT";
                document.getElementById("status").style.color = "green";
                document.getElementById("connectBtn").disabled = false;
                document.getElementById("startBtn").disabled = false;
            } catch (error) {
                document.getElementById("status").innerText = "ERROR: GOOGLE BLOCKING SCRIPT DOWNLOAD";
                document.getElementById("status").style.color = "red";
                console.error(error);
            }
        }

        // Initialize script verification right away on page boot
        initializeLibraries();

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 }); 
                const encoder = new TextEncoderStream();
                encoder.readable.pipeTo(port.writable);
                writer = encoder.writable.getWriter();
                document.getElementById('connectBtn').innerText = "Pico Connected!";
            } catch (err) {
                alert("USB Serial Connection Failed: " + err);
            }
        });

        document.getElementById('startBtn').addEventListener('click', async () => {
            document.getElementById('startBtn').innerText = "Loading AI Model...";
            
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";
            
            model = await tmImage.load(modelURL, metadataURL);
            
            webcam = new tmImage.Webcam(224, 224, true); 
            await webcam.setup({ facingMode: "environment" }); 
            await webcam.play();
            
            document.getElementById("webcam-container").innerHTML = ""; 
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            document.getElementById('startBtn').innerText = "AI Monitoring Live";
            window.requestAnimationFrame(loop);
        });

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        let lastState = "";
        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let deerConfidence = prediction[0].probability;
            let percentage = Math.round(deerConfidence * 100);
            let currentState = "CLEAR";

            if (percentage >= 90) {
                currentState = "CRITICAL";
                document.getElementById("status").innerText = `CRITICAL DETECT: ${percentage}%`;
                document.getElementById("status").style.color = "#ff4444";
            } else if (percentage >= 50) {
                currentState = "ALERT";
                document.getElementById("status").innerText = `WARNING ALERT: ${percentage}%`;
                document.getElementById("status").style.color = "#ffaa00";
            } else {
                currentState = "CLEAR";
                document.getElementById("status").innerText = `SAFE ROAD STATE: ${percentage}%`;
                document.getElementById("status").style.color = "#00ff00";
            }

            if (currentState !== lastState) {
                lastState = currentState;
                if (writer) {
                    await writer.write(currentState + "\n");
                }
            }
        }
    </script>
</body>
</html>
